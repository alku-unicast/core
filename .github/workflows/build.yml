name: CD (Release UniCast)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os: 'windows'
            arch: 'x86_64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi'
            gst_folder: 'windows'
          - platform: 'ubuntu-20.04'
            os: 'linux'
            arch: 'x86_64'
            gst_folder: 'linux'
          - platform: 'macos-13'
            os: 'macos'
            arch: 'x86_64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/macos/1.24.13/gstreamer-1.0-1.24.13-universal.pkg'
            gst_folder: 'macos/intel'
          - platform: 'macos-latest'
            os: 'macos'
            arch: 'aarch64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/macos/1.24.13/gstreamer-1.0-1.24.13-universal.pkg'
            gst_folder: 'macos/silicon'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || (matrix.arch == 'x86_64' && matrix.os == 'macos' && 'x86_64-apple-darwin' || '') }}

      # ============================================
      # LINUX: System packages + Tauri built-in GStreamer
      # ============================================
      - name: Setup GStreamer for Linux
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 patchelf fuse

      # ============================================
      # WINDOWS: GStreamer MSI + DLLs
      # ============================================
      - name: Cache GStreamer (Windows/macOS)
        id: cache-gst
        uses: actions/cache@v4
        with:
          path: app/src-tauri/gstreamer/${{ matrix.gst_folder }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-gst-1.24.13-v5

      - name: Download & Extract GStreamer (Windows)
        if: steps.cache-gst.outputs.cache-hit != 'true' && matrix.os == 'windows'
        run: |
          curl -L ${{ matrix.gst_url }} -o gst.msi
          mkdir -p gst_extract
          
          # Use 7z to fully extract MSI contents (msiexec /a is unreliable for binaries)
          7z x gst.msi -ogst_extract
          
          mkdir -p app/src-tauri/gstreamer/windows
          
          # Smart Search for the extracted GStreamer folder
          $extractedRoot = "$pwd\gst_extract"
          $found = $false
          $possiblePaths = @(
            "$extractedRoot\gstreamer",
            "$extractedRoot\PFiles\GStreamer",
            "$extractedRoot\gstreamer-1.0",
            (Get-ChildItem -Path $extractedRoot -Directory -Filter "gstreamer*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          )

          foreach ($src in $possiblePaths) {
            if ($src -and (Test-Path "$src\bin")) {
              Write-Host "Found GStreamer binaries at: $src"
              Copy-Item -Path "$src\*" -Destination "app/src-tauri/gstreamer/windows/" -Recurse -Force
              $found = $true
              break
            }
          }

          if (!$found) { 
              Write-Error "Could not find GStreamer bin directory in extraction"
              exit 1
          }

          # Source VC++ Runtime DLLs from System32 (Reliable in GitHub Runners)
          $binDir = "app/src-tauri/gstreamer/windows/bin"
          if (!(Test-Path $binDir)) { mkdir -p $binDir }
          Copy-Item "C:/Windows/System32/vcruntime140.dll" "$binDir/" -Force
          Copy-Item "C:/Windows/System32/msvcp140.dll" "$binDir/" -Force
          Copy-Item "C:/Windows/System32/vcruntime140_app.dll" "$binDir/" -Force -ErrorAction SilentlyContinue

      # ============================================
      # macOS: GStreamer PKG
      # ============================================
      - name: Download & Extract GStreamer (macOS)
        if: steps.cache-gst.outputs.cache-hit != 'true' && matrix.os == 'macos'
        run: |
          curl -L ${{ matrix.gst_url }} -o gst.pkg
          pkgutil --expand-full gst.pkg ./gst_expand
          mkdir -p app/src-tauri/gstreamer/${{ matrix.gst_folder }}

          # 1. Primary Strategy: Direct Target (Official PKG Structure)
          DIRECT_PATH=$(find ./gst_expand -type d -path "*/Versions/1.0" 2>/dev/null | head -1)
          if [ -z "$DIRECT_PATH" ]; then
             DIRECT_PATH=$(find ./gst_expand -type d -path "*/GStreamer.framework/Versions/Current" 2>/dev/null | head -1)
          fi

          if [ -n "$DIRECT_PATH" ] && [ -d "$DIRECT_PATH/lib" ]; then
            echo "Direct match found: $DIRECT_PATH"
            cp -R "$DIRECT_PATH"/* app/src-tauri/gstreamer/${{ matrix.gst_folder }}/
          else
            # 2. Fallback Strategy: Deep Search for known dylib
            echo "Direct match failed, starting deep search fallback..."
            CORE_DYLIB=$(find ./gst_expand -name "libgstreamer-1.0.0.dylib" 2>/dev/null | head -1)
            if [ -n "$CORE_DYLIB" ]; then
               BASE_DIR=$(dirname $(dirname "$CORE_DYLIB"))
               echo "Deep search found library root: $BASE_DIR"
               cp -R "$BASE_DIR"/* app/src-tauri/gstreamer/${{ matrix.gst_folder }}/
            fi
          fi

          # Verification
          if [ ! -d "app/src-tauri/gstreamer/${{ matrix.gst_folder }}/lib" ]; then
             echo "ERROR: Could not locate GStreamer libraries in expanded package"
             exit 1
          fi

      # ============================================
      # Build
      # ============================================
      - name: Frontend Build
        working-directory: ./app
        run: |
          npm install
          npm run build

      - name: Build Application (Tauri - Windows/macOS)
        if: matrix.os != 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./app
          tagName: v__VERSION__
          releaseName: 'UniCast v__VERSION__'
          releaseBody: 'UniCast Cross-Platform Release for ${{ matrix.os }} (${{ matrix.arch }})'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.arch == 'aarch64' && '--target aarch64-apple-darwin' || (matrix.os == 'macos' && '--target x86_64-apple-darwin' || '') }}

      - name: Build Linux AppImage with GStreamer
        if: matrix.os == 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_BUNDLE_GSTREAMER: "1"
        with:
          projectPath: ./app
          tagName: v__VERSION__
          releaseName: 'UniCast v__VERSION__'
          releaseBody: 'UniCast Cross-Platform Release for Linux (x86_64) - Portable with GStreamer embedded'
          releaseDraft: true
          prerelease: false
          args: '--bundles appimage'