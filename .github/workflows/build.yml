name: CD (Release UniCast)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os: 'windows'
            arch: 'x86_64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi'
            gst_folder: 'windows'
          - platform: 'ubuntu-20.04'
            os: 'linux'
            arch: 'x86_64'
            gst_folder: 'linux'
          - platform: 'macos-13'
            os: 'macos'
            arch: 'x86_64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/macos/1.24.13/gstreamer-1.0-1.24.13-universal.pkg'
            gst_folder: 'macos/intel'
          - platform: 'macos-latest'
            os: 'macos'
            arch: 'aarch64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/macos/1.24.13/gstreamer-1.0-1.24.13-universal.pkg'
            gst_folder: 'macos/silicon'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || (matrix.arch == 'x86_64' && matrix.os == 'macos' && 'x86_64-apple-darwin' || '') }}

      # ============================================
      # LINUX: System packages + Tauri built-in GStreamer
      # ============================================
      - name: Setup GStreamer for Linux
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 patchelf fuse

      # ============================================
      # WINDOWS: GStreamer MSI + DLLs
      # ============================================
      - name: Cache GStreamer (Windows/macOS)
        id: cache-gst
        uses: actions/cache@v4
        with:
          path: app/src-tauri/gstreamer/${{ matrix.gst_folder }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-gst-1.24.13-v2

      - name: Download & Extract GStreamer (Windows)
        if: steps.cache-gst.outputs.cache-hit != 'true' && matrix.os == 'windows'
        run: |
          curl -L ${{ matrix.gst_url }} -o gst.msi

          # Create extract directory
          mkdir -p gst_extract

          # Extract MSI using lessmsi (more reliable than msiexec /a)
          curl -L "https://github.com/activesmith/lessmsi/releases/download/v1.10.0/lessmsi-x64.exe" -o lessmsi.exe
          ./lessmsi.exe x gst.msi gst_extract\

          mkdir -p app/src-tauri/gstreamer/windows

          # Find GStreamer directory (try multiple possible paths)
          $gstPaths = @("gst_extract\gstreamer", "gst_extract\PFiles\GStreamer", "gst_extract\gstreamer-1.0")
          foreach ($path in $gstPaths) {
            if (Test-Path $path) {
              Copy-Item -Path "$path\*" -Destination "app/src-tauri/gstreamer/windows/" -Recurse -Force
              Write-Host "Copied from: $path"
              break
            }
          }

          # Source VC++ Runtime DLLs from System32 (Reliable in GitHub Runners)
          Copy-Item "C:/Windows/System32/vcruntime140.dll" "app/src-tauri/gstreamer/windows/bin/" -Force
          Copy-Item "C:/Windows/System32/msvcp140.dll" "app/src-tauri/gstreamer/windows/bin/" -Force
          Copy-Item "C:/Windows/System32/vcruntime140_app.dll" "app/src-tauri/gstreamer/windows/bin/" -Force -ErrorAction SilentlyContinue

      # ============================================
      # macOS: GStreamer PKG
      # ============================================
      - name: Download & Extract GStreamer (macOS)
        if: steps.cache-gst.outputs.cache-hit != 'true' && matrix.os == 'macos'
        run: |
          curl -L ${{ matrix.gst_url }} -o gst.pkg
          pkgutil --expand-full gst.pkg ./gst_expand
          mkdir -p app/src-tauri/gstreamer/${{ matrix.gst_folder }}

          # Find GStreamer.framework (pkg structure varies, try multiple patterns)
          FOUND_DIR=$(find ./gst_expand -type d \( -path "*/GStreamer.framework" -o -path "*/GStreamer.framework/Versions/Current" -o -path "*/GStreamer.framework/Versions/1.0" \) 2>/dev/null | head -1)

          if [ -n "$FOUND_DIR" ]; then
            echo "Found GStreamer at: $FOUND_DIR"
            cp -R "$FOUND_DIR"/* app/src-tauri/gstreamer/${{ matrix.gst_folder }}/ 2>/dev/null || true
            # If Versions/1.0 contents were copied, move them up
            if [ -d "app/src-tauri/gstreamer/${{ matrix.gst_folder }}/Versions/1.0" ]; then
              cp -R "app/src-tauri/gstreamer/${{ matrix.gst_folder }}/Versions/1.0/"* "app/src-tauri/gstreamer/${{ matrix.gst_folder }}/" 2>/dev/null || true
            fi
          else
            echo "WARNING: GStreamer path not found, trying alternative method..."
            # Try to find any .framework directory
            FRAMEWORK_DIR=$(find ./gst_expand -name "*.framework" -type d 2>/dev/null | head -1)
            if [ -n "$FRAMEWORK_DIR" ]; then
              cp -R "$FRAMEWORK_DIR"/* app/src-tauri/gstreamer/${{ matrix.gst_folder }}/ 2>/dev/null || true
            fi
          fi

          # Verify we got files
          if [ ! -d "app/src-tauri/gstreamer/${{ matrix.gst_folder }}/lib" ] && [ ! -d "app/src-tauri/gstreamer/${{ matrix.gst_folder }}/bin" ]; then
            echo "WARNING: GStreamer extraction may have failed, continuing anyway..."
          fi

      # ============================================
      # System Dependencies
      # ============================================
      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf fuse

      # ============================================
      # Build
      # ============================================
      - name: Frontend Build
        run: |
          npm install
          npm run build

      - name: Build Application (Tauri - Windows/macOS)
        if: matrix.os != 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'UniCast v__VERSION__'
          releaseBody: 'UniCast Cross-Platform Release for ${{ matrix.os }} (${{ matrix.arch }})'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.arch == 'aarch64' && '--target aarch64-apple-darwin' || (matrix.os == 'macos' && '--target x86_64-apple-darwin' || '') }}

      - name: Build Linux AppImage with GStreamer
        if: matrix.os == 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_BUNDLE_GSTREAMER: "1"
        with:
          tagName: v__VERSION__
          releaseName: 'UniCast v__VERSION__'
          releaseBody: 'UniCast Cross-Platform Release for Linux (x86_64) - Portable with GStreamer embedded'
          releaseDraft: true
          prerelease: false
          args: '--bundles appimage'