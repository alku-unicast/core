name: CD (Release UniCast)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: 'windows-latest'
            os: 'windows'
            arch: 'x86_64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi'
            gst_folder: 'windows'
            gst_resources: 'gstreamer/windows/**/*'
          - platform: 'macos-14'
            os: 'macos'
            arch: 'aarch64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/macos/1.24.13/gstreamer-1.0-1.24.13-universal.pkg'
            gst_folder: 'macos/silicon'
            gst_resources: 'gstreamer/macos/silicon/**/*'
          - platform: 'ubuntu-22.04'
            os: 'linux'
            arch: 'x86_64'
            gst_folder: 'linux'
            gst_resources: 'gstreamer/linux/**/*'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin' || '' }}

      # ============================================
      # LINUX: System packages + Tauri built-in GStreamer
      # ============================================
      - name: Setup GStreamer for Linux
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libx11-dev \
            patchelf \
            fuse \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pipewire

      - name: Bundle GStreamer for Linux AppImage
        if: matrix.os == 'linux'
        run: |
          # 1. Structure matching our unified resource logic
          mkdir -p app/src-tauri/gstreamer/linux/bin
          mkdir -p app/src-tauri/gstreamer/linux/lib/gstreamer-1.0

          # 2. Core Binaries
          cp /usr/bin/gst-launch-1.0 app/src-tauri/gstreamer/linux/bin/
          cp /usr/bin/gst-inspect-1.0 app/src-tauri/gstreamer/linux/bin/

          # 3. Detect multiarch path
          MA_PATH=$(gcc -print-multiarch)
          echo "Multiarch: $MA_PATH"
          
          # 4. Copy gst-plugin-scanner (Crucial for plugin discovery)
          GST_SCANNER=$(find /usr/lib/$MA_PATH -name "gst-plugin-scanner" 2>/dev/null | head -1)
          if [ -z "$GST_SCANNER" ]; then GST_SCANNER=$(find /usr/lib -name "gst-plugin-scanner" 2>/dev/null | head -1); fi
          
          if [ -n "$GST_SCANNER" ]; then
            cp "$GST_SCANNER" app/src-tauri/gstreamer/linux/bin/
            chmod +x app/src-tauri/gstreamer/linux/bin/gst-plugin-scanner
            echo "Bundled gst-plugin-scanner from: $GST_SCANNER"
          else
            echo "WARNING: gst-plugin-scanner NOT FOUND!"
          fi

          # 5. Copy Plugins
          cp /usr/lib/$MA_PATH/gstreamer-1.0/*.so app/src-tauri/gstreamer/linux/lib/gstreamer-1.0/
          
          # 6. COLLECT TRANSITIVE DEPENDENCIES (ldd magic)
          # This finds all .so files needed by our binaries/plugins and copies them to lib/
          # Fix: Include versioned .so* files in the scan
          echo "Gathering shared library dependencies..."
          find app/src-tauri/gstreamer/linux/ -type f -executable -o -name "*.so*" | xargs ldd | grep "=> /" | awk '{print $3}' | sort -u | \
            grep -v "libc.so" | \
            grep -v "libpthread.so" | \
            grep -v "libdl.so" | \
            grep -v "libm.so" | \
            grep -v "librt.so" | \
            grep -v "libresolv.so" | \
            grep -v "libgcc_s.so" | \
            grep -v "libstdc++.so" | \
            xargs -I {} cp -v {} app/src-tauri/gstreamer/linux/lib/
          
          echo "GStreamer standalone bundling complete."
          ls -R app/src-tauri/gstreamer/linux/

      # ============================================
      # WINDOWS: GStreamer MSI + DLLs
      # ============================================
      - name: Cache GStreamer (Windows/macOS)
        id: cache-gst
        uses: actions/cache@v4
        with:
          path: app/src-tauri/gstreamer/${{ matrix.gst_folder }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-gst-1.24.13-v12

      - name: Download & Install GStreamer (Windows)
        if: steps.cache-gst.outputs.cache-hit != 'true' && matrix.os == 'windows'
        run: |
          curl -L ${{ matrix.gst_url }} -o gst.msi
          
          Write-Host "Installing GStreamer (Full) to force all plugins..."
          $msiPath = (Resolve-Path "gst.msi").Path
          # /i = install, ADDLOCAL=ALL = all features, INSTALLDIR = custom path
          $proc = Start-Process msiexec -ArgumentList "/i `"$msiPath`" /qn /norestart ADDLOCAL=ALL INSTALLDIR=C:\gst_install" -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) {
              Write-Error "MSI Installation failed with exit code $($proc.ExitCode)"
              exit 1
          }

          # DETECTIVE WORK: Search for the real GStreamer root folder
          Write-Host "Searching for GStreamer binaries in C:\gst_install and C:\gstreamer..."
          $searchRoots = @("C:\gst_install", "C:\gstreamer")
          $gstLaunch = $null
          foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                  $gstLaunch = Get-ChildItem -Path $root -Filter "gst-launch-1.0.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($gstLaunch) { break }
              }
          }

          if (!$gstLaunch) {
              Write-Error "CRITICAL: Could not find gst-launch-1.0.exe after setup."
              exit 1
          }
          
          $gstInstallRoot = $gstLaunch.Directory.Parent.FullName
          Write-Host "Confirmed GStreamer Root: $gstInstallRoot"

          $targetDir = "app/src-tauri/gstreamer/windows"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          
          Write-Host "Copying GStreamer files using Robocopy..."
          # robocopy exit codes: 0-7 are success (0=no files, 1=copied, 2+ = extra files/mismatch)
          # 8 or higher is a real failure.
          robocopy "$gstInstallRoot" "$targetDir" /E /MT:32 /R:3 /W:5 /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) {
              Write-Error "Robocopy failed with exit code $LASTEXITCODE"
              exit 1
          }
          # Reset exit code for GitHub Actions
          $global:LASTEXITCODE = 0 
          
          # VERIFICATION: Ensure the critical DLL is there
          Write-Host "Searching for any D3D related plugins..."
          $d3dPlugins = Get-ChildItem -Path "$targetDir" -Filter "*d3d*.dll" -Recurse -ErrorAction SilentlyContinue
          if ($d3dPlugins) {
              Write-Host "Found D3D plugins:"
              $d3dPlugins | ForEach-Object { Write-Host "- $($_.Name) at $($_.FullName)" }
          } else {
              Write-Host "WARNING: No D3D plugins found at all!"
          }

          # Verify the DX9/GDI fallback plugin is present (our working capture source).
          $d3d11Dll = Get-ChildItem -Path "$targetDir" -Filter "gstd3d11.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($d3d11Dll) {
              Write-Host "  [OK] gstd3d11.dll (D3D11 primary) verified at $($d3d11Dll.FullName)"
          } else {
              Write-Host "  [WARNING] gstd3d11.dll NOT found. D3D11 capture will not be available."
          }

          $dllSearch = Get-ChildItem -Path "$targetDir" -Filter "gstwinscreencap.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$dllSearch) {
              Write-Host "WARNING: gstwinscreencap.dll (DX9/GDI fallback) NOT found - listing plugin dir:"
              if (Test-Path "$targetDir\lib\gstreamer-1.0") {
                  Get-ChildItem -Path "$targetDir\lib\gstreamer-1.0" | Select-Object Name, Length -First 50 | Format-Table
              }
              Write-Error "CRITICAL FAILURE: gstwinscreencap.dll NOT FOUND. DX9/GDI capture will not work."
              exit 1
          }
          Write-Host "Success: gstwinscreencap.dll verified at $($dllSearch.FullName)"

          # ── VC++ Runtime DLL Diagnostics & Copy ────────────────────────────────
          # Copy from GitHub runner's System32 to ensure the app runs on clean machines.
          $binDir = "$targetDir/bin"
          $dlls = @(
              "vcruntime140.dll", 
              "vcruntime140_1.dll", 
              "msvcp140.dll", 
              "msvcp140_1.dll", 
              "msvcp140_2.dll", 
              "vcruntime140_app.dll", 
              "concrt140.dll"
          )

          Write-Host "Checking VC++ Runtime DLLs on runner..."
          foreach ($dll in $dlls) {
              $sourcePath = "C:/Windows/System32/$dll"
              if (Test-Path $sourcePath) {
                  $size = (Get-Item $sourcePath).Length
                  Write-Host "  [OK] Found $dll ($size bytes), copying to bin/..."
                  Copy-Item $sourcePath "$binDir/" -Force
              } else {
                  Write-Host "  [MISSING] $dll NOT FOUND on runner System32!"
              }
          }


      # ============================================
      # macOS: GStreamer PKG
      # ============================================
      - name: Download & Extract GStreamer (macOS)
        if: steps.cache-gst.outputs.cache-hit != 'true' && matrix.os == 'macos'
        run: |
          curl -L ${{ matrix.gst_url }} -o gst.pkg
          pkgutil --expand-full gst.pkg ./gst_expand
          mkdir -p app/src-tauri/gstreamer/${{ matrix.gst_folder }}

          # The GStreamer universal pkg expands into multiple sub-packages (core, base, good,
          # bad, ugly, libav, devel, ...), each with its own Payload directory.
          # libgst*.dylib lives in the core Payload; libglib-2.0.0.dylib and other
          # third-party deps live in a different sub-package Payload.
          # We must merge ALL Payload directories into the target.
          echo "Merging all sub-package Payloads..."
          MERGED=0
          while IFS= read -r payload_dir; do
            if [ -d "$payload_dir/lib" ] || [ -d "$payload_dir/bin" ]; then
              echo "  + $payload_dir"
              rsync -a "$payload_dir"/ app/src-tauri/gstreamer/${{ matrix.gst_folder }}/
              MERGED=$((MERGED + 1))
            fi
          done < <(find ./gst_expand -maxdepth 3 -type d -name "Payload" 2>/dev/null)

          if [ "$MERGED" -eq 0 ]; then
            echo "ERROR: No valid Payload directories found in expanded pkg"
            echo "gst_expand contents:"
            ls ./gst_expand
            exit 1
          fi
          echo "Merged $MERGED sub-package(s)"

          # Verification — check lib dir AND at least one core dylib (not just plugin directory)
          GST_LIB_DIR="app/src-tauri/gstreamer/${{ matrix.gst_folder }}/lib"
          if [ ! -d "$GST_LIB_DIR" ]; then
             echo "ERROR: Could not locate GStreamer lib directory in expanded package"
             exit 1
          fi
          CORE_DYLIB_CHECK=$(find "$GST_LIB_DIR" -maxdepth 1 -name "libglib-2.0*.dylib" 2>/dev/null | head -1)
          if [ -z "$CORE_DYLIB_CHECK" ]; then
             echo "ERROR: GStreamer lib directory exists but is missing core dylibs (libglib-2.0.*.dylib)"
             echo "Contents of $GST_LIB_DIR:"
             ls "$GST_LIB_DIR" | head -20
             exit 1
          fi
          echo "Verification OK: found core dylib at $CORE_DYLIB_CHECK"

      # ============================================
      # Build
      # ============================================
      - name: Create Dynamic Resource Config
        if: matrix.gst_resources != ''
        shell: pwsh
        run: |
          $config = @{
            bundle = @{
              resources = @("${{ matrix.gst_resources }}")
            }
          }
          # Create the file INSIDE the app directory where Tauri runs
          $config | ConvertTo-Json | Out-File -FilePath "app/tauri-resource-override.json" -Encoding utf8
          echo "--- Tauri resource config ---"
          cat app/tauri-resource-override.json

      - name: Frontend Build
        working-directory: ./app
        run: |
          npm install
          npm run build

      - name: Build Application (Tauri - Windows/macOS)
        if: matrix.os != 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./app
          tagName: v__VERSION__ # Tauri will replace this with version from tauri.conf.json
          releaseName: 'UniCast v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: >
            ${{ (matrix.os == 'macos' && (matrix.arch == 'aarch64' && '--target aarch64-apple-darwin' || '--target x86_64-apple-darwin') || '') }}
            --config tauri-resource-override.json

      - name: Build Linux AppImage with GStreamer
        if: matrix.os == 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_BUNDLE_GSTREAMER: "1"
        with:
          projectPath: ./app
          tagName: v__VERSION__
          releaseName: 'UniCast v__VERSION__'
          releaseBody: 'UniCast Cross-Platform Release for Linux (x86_64) - Portable with GStreamer embedded'
          releaseDraft: true
          prerelease: false
          args: >
            --bundles appimage
            --config tauri-resource-override.json