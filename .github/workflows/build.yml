name: CD (Release UniCast)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: 'windows-latest'
            os: 'windows'
            arch: 'x86_64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi'
            gst_folder: 'windows'
          - platform: 'ubuntu-22.04'
            os: 'linux'
            arch: 'x86_64'
            gst_folder: 'linux'
          - platform: 'macos-latest'
            os: 'macos'
            arch: 'aarch64'
            gst_url: 'https://gstreamer.freedesktop.org/data/pkg/macos/1.24.13/gstreamer-1.0-1.24.13-universal.pkg'
            gst_folder: 'macos/silicon'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin' || '' }}

      # ============================================
      # LINUX: System packages + Tauri built-in GStreamer
      # ============================================
      - name: Setup GStreamer for Linux
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            fuse \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      # ============================================
      # WINDOWS: GStreamer MSI + DLLs
      # ============================================
      - name: Cache GStreamer (Windows/macOS)
        id: cache-gst
        uses: actions/cache@v4
        with:
          path: app/src-tauri/gstreamer/${{ matrix.gst_folder }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-gst-1.24.13-v6

      - name: Download & Install GStreamer (Windows)
        if: steps.cache-gst.outputs.cache-hit != 'true' && matrix.os == 'windows'
        run: |
          curl -L ${{ matrix.gst_url }} -o gst.msi
          
          Write-Host "Installing GStreamer (Full) to force all plugins..."
          $msiPath = (Resolve-Path "gst.msi").Path
          # /i = install, ADDLOCAL=ALL = all features, INSTALLDIR = custom path
          $proc = Start-Process msiexec -ArgumentList "/i `"$msiPath`" /qn /norestart ADDLOCAL=ALL INSTALLDIR=C:\gst_install" -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) {
              Write-Error "MSI Installation failed with exit code $($proc.ExitCode)"
              exit 1
          }

          # DETECTIVE WORK: Search for the real GStreamer root folder
          Write-Host "Searching for GStreamer binaries in C:\gst_install and C:\gstreamer..."
          $searchRoots = @("C:\gst_install", "C:\gstreamer")
          $gstLaunch = $null
          foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                  $gstLaunch = Get-ChildItem -Path $root -Filter "gst-launch-1.0.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($gstLaunch) { break }
              }
          }

          if (!$gstLaunch) {
              Write-Error "CRITICAL: Could not find gst-launch-1.0.exe after setup."
              exit 1
          }
          
          $gstInstallRoot = $gstLaunch.Directory.Parent.FullName
          Write-Host "Confirmed GStreamer Root: $gstInstallRoot"

          $targetDir = "app/src-tauri/gstreamer/windows"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          
          Write-Host "Copying GStreamer files using Robocopy..."
          # robocopy exit codes: 0-7 are success (0=no files, 1=copied, 2+ = extra files/mismatch)
          # 8 or higher is a real failure.
          robocopy "$gstInstallRoot" "$targetDir" /E /MT:32 /R:3 /W:5 /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) {
              Write-Error "Robocopy failed with exit code $LASTEXITCODE"
              exit 1
          }
          # Reset exit code for GitHub Actions
          $global:LASTEXITCODE = 0 
          
          # VERIFICATION: Ensure the critical DLL is there
          $dllSearch = Get-ChildItem -Path "$targetDir" -Filter "libgstd3d11.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$dllSearch) {
              Write-Error "CRITICAL FAILURE: libgstd3d11.dll NOT FOUND in target directory!"
              Write-Host "--- Listing plugins directory for debugging (Top 100) ---"
              Get-ChildItem -Path "$targetDir\lib\gstreamer-1.0" | Select-Object -First 100 | Format-Table Name, Length
              exit 1
          }
          Write-Host "Success: libgstd3d11.dll verified at $($dllSearch.FullName)"

          # Source VC++ Runtime DLLs from System32 (Reliable in GitHub Runners)
          $binDir = "$targetDir/bin"
          Copy-Item "C:/Windows/System32/vcruntime140.dll" "$binDir/" -Force
          Copy-Item "C:/Windows/System32/msvcp140.dll" "$binDir/" -Force
          Copy-Item "C:/Windows/System32/vcruntime140_app.dll" "$binDir/" -Force -ErrorAction SilentlyContinue

      # ============================================
      # macOS: GStreamer PKG
      # ============================================
      - name: Download & Extract GStreamer (macOS)
        if: steps.cache-gst.outputs.cache-hit != 'true' && matrix.os == 'macos'
        run: |
          curl -L ${{ matrix.gst_url }} -o gst.pkg
          pkgutil --expand-full gst.pkg ./gst_expand
          mkdir -p app/src-tauri/gstreamer/${{ matrix.gst_folder }}

          # 1. Primary Strategy: Direct Target (Official PKG Structure)
          DIRECT_PATH=$(find ./gst_expand -type d -path "*/Versions/1.0" 2>/dev/null | head -1)
          if [ -z "$DIRECT_PATH" ]; then
             DIRECT_PATH=$(find ./gst_expand -type d -path "*/GStreamer.framework/Versions/Current" 2>/dev/null | head -1)
          fi

          if [ -n "$DIRECT_PATH" ] && [ -d "$DIRECT_PATH/lib" ]; then
            echo "Direct match found: $DIRECT_PATH"
            cp -R "$DIRECT_PATH"/* app/src-tauri/gstreamer/${{ matrix.gst_folder }}/
          else
            # 2. Fallback Strategy: Deep Search for known dylib
            echo "Direct match failed, starting deep search fallback..."
            CORE_DYLIB=$(find ./gst_expand -name "libgstreamer-1.0.0.dylib" 2>/dev/null | head -1)
            if [ -n "$CORE_DYLIB" ]; then
               BASE_DIR=$(dirname $(dirname "$CORE_DYLIB"))
               echo "Deep search found library root: $BASE_DIR"
               cp -R "$BASE_DIR"/* app/src-tauri/gstreamer/${{ matrix.gst_folder }}/
            fi
          fi

          # Verification
          if [ ! -d "app/src-tauri/gstreamer/${{ matrix.gst_folder }}/lib" ]; then
             echo "ERROR: Could not locate GStreamer libraries in expanded package"
             exit 1
          fi

      # ============================================
      # Build
      # ============================================
      - name: Write Tauri resource config (Windows/macOS)
        if: matrix.os != 'linux'
        shell: bash
        run: |
          echo '{"bundle":{"resources":["gstreamer/${{ matrix.gst_folder }}/**/*"]}}' > app/tauri-resource-override.json
          echo "--- Tauri resource config ---"
          cat app/tauri-resource-override.json

      - name: Frontend Build
        working-directory: ./app
        run: |
          npm install
          npm run build

      - name: Build Application (Tauri - Windows/macOS)
        if: matrix.os != 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./app
          tagName: ${{ github.ref_name }}
          releaseName: 'UniCast ${{ github.ref_name }}'
          releaseBody: 'UniCast Cross-Platform Release for ${{ matrix.os }} (${{ matrix.arch }})'
          releaseDraft: true
          prerelease: false
          args: >
            ${{ (matrix.os == 'macos' && (matrix.arch == 'aarch64' && '--target aarch64-apple-darwin' || '--target x86_64-apple-darwin') || '') }}
            --config tauri-resource-override.json

      - name: Build Linux AppImage with GStreamer
        if: matrix.os == 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_BUNDLE_GSTREAMER: "1"
        with:
          projectPath: ./app
          tagName: ${{ github.ref_name }}
          releaseName: 'UniCast ${{ github.ref_name }}'
          releaseBody: 'UniCast Cross-Platform Release for Linux (x86_64) - Portable with GStreamer embedded'
          releaseDraft: true
          prerelease: false
          args: '--bundles appimage'